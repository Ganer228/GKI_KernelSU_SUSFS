name: Apply uke kernel branding

description: Match the release and SCM/KMI settings of the known-working Xiaomi Pad 7 kernel

inputs:
  variant:
    description: 'Build variant'
    required: true
  kernel_version:
    description: 'Kernel version'
    required: true
  android_version:
    description: 'Android version'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true

runs:
  using: composite
  steps:
    - name: Apply exact uke release and working trim profile
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        test "${{ inputs.variant }}" = "Normal"
        test "${{ inputs.android_version }}" = "android14"
        test "${{ inputs.kernel_version }}" = "6.1"
        test "${{ inputs.sublevel }}" = "118"

        # The known-working Image has LOCALVERSION_AUTO and MODULE_SCMVERSION
        # enabled, while its patched setlocalversion emits this exact suffix.
        sed -i '$d' scripts/setlocalversion
        echo 'echo "uke-Droidspaces-ReSukiSU"' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion
        : > .scmversion

        cat >> "${{ github.workspace }}/wild_gki.fragment" << 'EOF'
        CONFIG_LOCALVERSION=""
        CONFIG_LOCALVERSION_AUTO=y
        CONFIG_MODULE_SCMVERSION=y
        CONFIG_TRIM_UNUSED_KSYMS=y
        CONFIG_UNUSED_KSYMS_WHITELIST="abi_symbollist.raw"
        EOF

        echo 'Target release: 6.1.118uke-Droidspaces-ReSukiSU'
        echo 'Target KMI profile: trim + abi_symbollist.raw + module SCM version'
