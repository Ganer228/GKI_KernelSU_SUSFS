name: 'Apply Kernel Branding & Timestamp'
description: 'Apply device-compatible kernel release branding'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 118)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        if [[ "${{ inputs.version }}" == "android14-6.1" && "${{ inputs.sublevel }}" == "118" ]]; then
          # Match the release string of the known-working uke kernel exactly.
          # Base VERSION is 6.1.118, so this produces:
          # 6.1.118uke-Droidspaces-ReSukiSU
          sed -i '$d' scripts/setlocalversion
          echo 'echo "uke-Droidspaces-ReSukiSU"' >> scripts/setlocalversion
          echo "Applied uke-compatible release suffix: uke-Droidspaces-ReSukiSU"
        elif [[ "${{ inputs.version }}" == "android15-6.6" || "${{ inputs.version }}" == "android16-6.12" ]]; then
          VERSION="${{ inputs.version }}"
          ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
          KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
          KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
          sed -i '$d' scripts/setlocalversion
          echo "echo \"$KERNEL_STRING-Wild\"" >> scripts/setlocalversion
        else
          VERSION="${{ inputs.version }}"
          ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
          sed -i '$d' scripts/setlocalversion
          echo "echo \"-$ANDROID_PART-Wild\"" >> scripts/setlocalversion
        fi

        chmod +x scripts/setlocalversion
