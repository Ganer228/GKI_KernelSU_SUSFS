name: Apply uke USER_NS twin identity

description: Match the booting baseline and switch only CONFIG_USER_NS from n to y

inputs:
  variant:
    description: 'Build variant'
    required: true
  kernel_version:
    description: 'Kernel version'
    required: true
  android_version:
    description: 'Android version'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true

runs:
  using: composite
  steps:
    - name: Apply exact release KMI profile and USER_NS delta
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        test "${{ inputs.variant }}" = "Normal"
        test "${{ inputs.android_version }}" = "android14"
        test "${{ inputs.kernel_version }}" = "6.1"
        test "${{ inputs.sublevel }}" = "118"

        sed -i '$d' scripts/setlocalversion
        echo 'echo "uke-Droidspaces-ReSukiSU"' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion
        : > .scmversion

        FRAGMENT="${{ github.workspace }}/wild_gki.fragment"

        # The successful baseline contains exactly one disabled USER_NS line.
        # Replace it in place so no other fragment assignment changes position.
        BEFORE="$(grep -c '^# CONFIG_USER_NS is not set$' "$FRAGMENT" || true)"
        ENABLED_BEFORE="$(grep -c '^CONFIG_USER_NS=y$' "$FRAGMENT" || true)"
        test "$BEFORE" = "1"
        test "$ENABLED_BEFORE" = "0"
        sed -i 's/^# CONFIG_USER_NS is not set$/CONFIG_USER_NS=y/' "$FRAGMENT"
        test "$(grep -c '^CONFIG_USER_NS=y$' "$FRAGMENT")" = "1"
        test "$(grep -c '^# CONFIG_USER_NS is not set$' "$FRAGMENT" || true)" = "0"

        cat >> "$FRAGMENT" << 'EOF'
        CONFIG_LOCALVERSION=""
        CONFIG_LOCALVERSION_AUTO=y
        CONFIG_MODULE_SCMVERSION=y
        CONFIG_TRIM_UNUSED_KSYMS=y
        CONFIG_UNUSED_KSYMS_WHITELIST="abi_symbollist.raw"
        EOF

        python3 - "$FRAGMENT" << 'PY'
        from pathlib import Path
        import re
        import sys

        path = Path(sys.argv[1])
        assignments = {}
        duplicates = []
        for number, raw in enumerate(path.read_text().splitlines(), start=1):
            line = raw.strip()
            enabled = re.fullmatch(r'(CONFIG_[A-Z0-9_]+)=(.*)', line)
            disabled = re.fullmatch(r'# (CONFIG_[A-Z0-9_]+) is not set', line)
            if enabled:
                symbol, value = enabled.group(1), enabled.group(2)
            elif disabled:
                symbol, value = disabled.group(1), 'n'
            else:
                continue
            if symbol in assignments:
                old_line, old_value = assignments[symbol]
                duplicates.append((symbol, old_line, old_value, number, value))
            else:
                assignments[symbol] = (number, value)

        if duplicates:
            print('ERROR: duplicate Kconfig assignments:')
            for symbol, old_line, old_value, new_line, new_value in duplicates:
                print(f'  {symbol}: line {old_line}={old_value!r}, line {new_line}={new_value!r}')
            raise SystemExit(1)

        if assignments.get('CONFIG_USER_NS', (None, None))[1] != 'y':
            raise SystemExit('CONFIG_USER_NS=y is not the unique USER_NS assignment')
        print(f'USER_NS twin fragment verified: {len(assignments)} unique symbols')
        PY

        echo 'Target release: 6.1.118uke-Droidspaces-ReSukiSU'
        echo 'Twin delta: CONFIG_USER_NS=n -> y only'
