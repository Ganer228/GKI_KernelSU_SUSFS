name: Build and verify uke USER_NS twin

description: Build the booting baseline with only CONFIG_USER_NS changed to y

runs:
  using: composite
  steps:
    - name: Build USER_NS twin Image
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        LOG="${{ github.workspace }}/kernel-build.log"
        : > "$LOG"
        cp common/arch/arm64/configs/gki_defconfig "${{ github.workspace }}/prebuild-gki_defconfig"
        export CCACHE_DIR="$GITHUB_WORKSPACE/kernel/.ccache"
        export PATH="/usr/lib/ccache:$PATH"
        export KBUILD_BUILD_USER=build-user
        export KBUILD_BUILD_HOST=build-host
        cp "$GITHUB_WORKSPACE/wild_gki.fragment" common/arch/arm64/configs/wild_gki.fragment
        set +e
        tools/bazel build \
          --config=fast \
          --lto=thin \
          --config=stamp \
          --action_env=KBUILD_BUILD_USER=build-user \
          --action_env=KBUILD_BUILD_HOST=build-host \
          --defconfig_fragment=//common:arch/arm64/configs/wild_gki.fragment \
          //common:kernel_aarch64/Image 2>&1 | tee "$LOG"
        STATUS=${PIPESTATUS[0]}
        set -e
        test "$STATUS" = 0

    - name: Verify sole USER_NS delta
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        OUT="${{ github.workspace }}/AnyKernel3"
        mkdir -p "$OUT"
        cp "${{ github.workspace }}/kernel/bazel-bin/common/kernel_aarch64/Image" "$OUT/Image"
        sha256sum "$OUT/Image" | tee "$OUT/Image.sha256"

        EXTRACT="${{ github.workspace }}/kernel/common/scripts/extract-ikconfig"
        ACTUAL="$OUT/uke-userns-twin.config"
        NORMALIZED="$OUT/uke-userns-normalized.config"
        bash "$EXTRACT" "$OUT/Image" > "$ACTUAL"

        python3 - "$ACTUAL" "$NORMALIZED" << 'PY'
        from pathlib import Path
        import sys
        src = Path(sys.argv[1]).read_text()
        on = "CONFIG_USER_NS=y\n"
        off = "# CONFIG_USER_NS is not set\n"
        if src.count(on) != 1 or off in src:
            raise SystemExit("USER_NS assignment is not exactly CONFIG_USER_NS=y")
        Path(sys.argv[2]).write_text(src.replace(on, off, 1))
        PY

        ACTUAL_SHA="$(sha256sum "$ACTUAL" | awk '{print $1}')"
        NORMALIZED_SHA="$(sha256sum "$NORMALIZED" | awk '{print $1}')"
        BASELINE_SHA="91e3593a6b8074418b4cc527b241f354f9e19245eee6328186af7f917e224b84"
        test "$NORMALIZED_SHA" = "$BASELINE_SHA" || {
          echo "ERROR: config changed beyond USER_NS"
          echo "normalized=$NORMALIZED_SHA baseline=$BASELINE_SHA"
          exit 1
        }

        IMAGE="$OUT/Image"
        grep -aFq '6.1.118uke-Droidspaces-ReSukiSU' "$IMAGE"
        grep -aFq 'v4.1.0-2206a7dd@ReSukiSU' "$IMAGE"
        grep -aFq 'clang version 17.0.2' "$IMAGE"
        SIZE="$(stat -c '%s' "$IMAGE")"
        test "$SIZE" -le 37079552 || {
          echo "ERROR: Image exceeds working kernel slot: $SIZE"
          exit 1
        }

        cp "${{ github.workspace }}/wild_gki.fragment" "$OUT/uke-userns-twin.fragment"
        {
          echo 'release=6.1.118uke-Droidspaces-ReSukiSU'
          echo 'user_ns=y'
          echo 'only_config_delta=CONFIG_USER_NS'
          echo "config_sha256=$ACTUAL_SHA"
          echo "normalized_baseline_sha256=$NORMALIZED_SHA"
          echo "image_size=$SIZE"
          sha256sum "$IMAGE"
        } > "$OUT/uke-userns-twin-build.txt"
        echo "Verified: USER_NS is the sole config delta from the booting baseline"

    - name: Upload USER_NS twin diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: uke-6.1.118-userns-twin-diagnostics
        path: |
          ${{ github.workspace }}/kernel-build.log
          ${{ github.workspace }}/prebuild-gki_defconfig
          ${{ github.workspace }}/wild_gki.fragment
          ${{ github.workspace }}/AnyKernel3/Image
          ${{ github.workspace }}/AnyKernel3/Image.sha256
          ${{ github.workspace }}/AnyKernel3/uke-userns-twin.config
          ${{ github.workspace }}/AnyKernel3/uke-userns-normalized.config
          ${{ github.workspace }}/AnyKernel3/uke-userns-twin-build.txt
        if-no-files-found: ignore
        compression-level: 9
