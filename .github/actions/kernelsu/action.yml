name: Setup KernelSU-Next
description: Download and configure KernelSU-Next with version tracking
inputs:
  ksu_branch:
    description: 'KernelSU-Next branch, tag, or commit (empty = official dev branch)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download KernelSU-Next
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev"
        fi

        echo "Using official KernelSU-Next ref: $KSU_INPUT"
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" \
          | bash -s "$KSU_INPUT"

        git -C KernelSU-Next rev-parse --verify HEAD
        echo "KernelSU-Next checked out at: $(git -C KernelSU-Next rev-parse --short HEAD)"

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail

        KSU_GIT_VERSION=$(git rev-list --count HEAD)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short HEAD)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

        echo "KernelSU-Next ref: $KSU_COMMIT"
        echo "KernelSU-Next version: $KSU_VERSION"
        echo "KernelSU-Next tag: ${KSU_GIT_TAG:-none}"

    - name: Apply KernelSU-Next compatibility patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail

        PATCH_FILE="${{ github.action_path }}/patches/static.patch"
        if patch --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
          patch -p1 < "$PATCH_FILE"
        elif patch --reverse --dry-run -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
          echo "KernelSU-Next compatibility patch is already applied"
        else
          echo "ERROR: KernelSU-Next compatibility patch no longer applies"
          exit 1
        fi

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
