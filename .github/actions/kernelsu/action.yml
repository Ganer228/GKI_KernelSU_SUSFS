name: Setup ReSukiSU
description: Download and configure the ReSukiSU revision used by the working uke kernel
inputs:
  ksu_branch:
    description: 'ReSukiSU branch, tag, or commit (empty = pinned working uke revision)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download pinned ReSukiSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="2206a7dd71e600f34378c4c583244f46e7a35670"
        fi

        echo "Using ReSukiSU ref: $KSU_INPUT"
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
          | bash -s "$KSU_INPUT"

        git -C KernelSU rev-parse --verify HEAD
        ACTUAL_KSU_COMMIT="$(git -C KernelSU rev-parse HEAD)"
        echo "ReSukiSU checked out at: $ACTUAL_KSU_COMMIT"

        if [ "$KSU_INPUT" = "2206a7dd71e600f34378c4c583244f46e7a35670" ] && \
           [ "$ACTUAL_KSU_COMMIT" != "$KSU_INPUT" ]; then
          echo "ERROR: pinned ReSukiSU revision was not checked out"
          exit 1
        fi

    - name: Extract ReSukiSU version info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        set -euo pipefail

        KSU_GIT_VERSION=$(git rev-list --count HEAD)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short HEAD)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

        echo "ReSukiSU ref: $KSU_COMMIT"
        echo "ReSukiSU version: $KSU_VERSION"
        echo "ReSukiSU tag: ${KSU_GIT_TAG:-none}"

    - name: Enable working uke ReSukiSU configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KSU_TRACEPOINT_HOOK=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          CONFIG_KSU_MANUAL_HOOK=n
          CONFIG_KSU_SUSFS=n
