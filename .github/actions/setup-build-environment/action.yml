name: Setup uke baseline build environment

description: Install build prerequisites and clone only pinned kernel dependencies

inputs:
  patches_commit:
    required: false
  anykernel_commit:
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y ccache aria2 pigz

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        mkdir -p "${{ github.workspace }}/kernel"
        mkdir -p "${{ github.workspace }}/git-repo"
        curl -fL https://storage.googleapis.com/git-repo-downloads/repo \
          -o "${{ github.workspace }}/git-repo/repo"
        chmod +x "${{ github.workspace }}/git-repo/repo"
        echo "${{ github.workspace }}/git-repo" >> "$GITHUB_PATH"

        PATCHES_REF="${{ inputs.patches_commit }}"
        if [ -z "$PATCHES_REF" ]; then
          echo "ERROR: patches_commit must be pinned for the baseline"
          exit 1
        fi

        rm -rf "${{ github.workspace }}/kernel_patches"
        git clone https://github.com/WildKernels/kernel_patches.git \
          "${{ github.workspace }}/kernel_patches"
        git -C "${{ github.workspace }}/kernel_patches" checkout "$PATCHES_REF"
        test "$(git -C "${{ github.workspace }}/kernel_patches" rev-parse HEAD)" = "$PATCHES_REF"

        ANYKERNEL_REF="${{ inputs.anykernel_commit }}"
        if [ -z "$ANYKERNEL_REF" ]; then
          echo "ERROR: anykernel_commit must be pinned for the baseline"
          exit 1
        fi

        rm -rf "${{ github.workspace }}/AnyKernel3"
        git clone https://github.com/WildKernels/AnyKernel3.git \
          "${{ github.workspace }}/AnyKernel3"
        git -C "${{ github.workspace }}/AnyKernel3" checkout "$ANYKERNEL_REF"
        test "$(git -C "${{ github.workspace }}/AnyKernel3" rev-parse HEAD)" = "$ANYKERNEL_REF"

        echo "Pinned kernel_patches: $PATCHES_REF"
        echo "Pinned AnyKernel3: $ANYKERNEL_REF"
