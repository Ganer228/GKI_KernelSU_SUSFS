name: Uke baseline kernel build

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      kernel_version:
        required: true
        type: string
      variant:
        required: false
        type: string
        default: Normal
      ksu_commit:
        required: false
        type: string
      anykernel_commit:
        required: false
        type: string
      patches_commit:
        required: false
        type: string
      susfs_commit:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      use_repo:
        required: false
        type: boolean
        default: false

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Parse kernel version
        id: parse
        uses: ./.github/actions/parse-kernel-version
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: "3.1.1"
          testing: false

      - name: Setup swap for Thin LTO
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 25

      - name: Setup pinned build environment
        uses: ./.github/actions/setup-build-environment
        with:
          patches_commit: ${{ inputs.patches_commit }}
          anykernel_commit: ${{ inputs.anykernel_commit }}

      - name: Download exact ACK source
        uses: ./.github/actions/download-kernel
        with:
          android_version: ${{ steps.parse.outputs.android_version }}
          kernel_version: ${{ steps.parse.outputs.kernel_version }}
          os_patch_level: ${{ steps.parse.outputs.os_patch_level }}
          use_repo: ${{ inputs.use_repo }}

      - name: Extract sublevel and file name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          variant: ${{ inputs.variant }}

      - name: Apply generic kernel compatibility fixes
        uses: ./.github/actions/kernel-fixes
        with:
          android_version: ${{ steps.parse.outputs.android_version }}
          kernel_version: ${{ steps.parse.outputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ steps.parse.outputs.os_patch_level }}

      - name: Setup pinned ReSukiSU
        if: contains(inputs.feature_set, 'KSUN')
        uses: ./.github/actions/kernelsu
        with:
          ksu_commit: ${{ inputs.ksu_commit }}

      - name: Apply pinned uke DroidSpaces baseline
        if: contains(inputs.feature_set, 'DS')
        uses: ./.github/actions/droidspaces
        with:
          kernel_version: ${{ steps.parse.outputs.kernel_version }}

      - name: Apply misc working configs
        uses: ./.github/actions/misc
        with:
          kernel_version: ${{ steps.parse.outputs.kernel_version }}
          android_version: ${{ steps.parse.outputs.android_version }}

      - name: Apply exact working release string
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ steps.parse.outputs.kernel_version }}
          android_version: ${{ steps.parse.outputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove protected exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean kernel flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Build and verify baseline Image
        uses: ./.github/actions/build-kernel

      - name: Upload verified baseline Image
        uses: actions/upload-artifact@v7
        with:
          name: 6.1.118-android14-2025-01-uke-baseline
          path: |
            ${{ github.workspace }}/AnyKernel3/Image
            ${{ github.workspace }}/AnyKernel3/Image.sha256
            ${{ github.workspace }}/AnyKernel3/uke-baseline.config
            ${{ github.workspace }}/AnyKernel3/uke-baseline.fragment
            ${{ github.workspace }}/AnyKernel3/uke-baseline-build.txt
          if-no-files-found: error
          compression-level: 9
